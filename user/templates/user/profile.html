<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - PhishShield LMS</title>
</head>
<body style="margin: 0; padding: 40px 20px; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">

    <!-- MAIN PROFILE CARD CONTAINER -->
    <div style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 680px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);">
                  <div>  <!-- BACK BUTTON -->
            <button onclick="window.history.back()" style="background-color: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                ← Back
            </button>
            </div>
        <!-- HEADER SECTION -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 25px;">
            <div>
                <h1 style="margin: 0; font-size: 22px; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                    👤 My Profile
                </h1>
                <p style="margin: 5px 0 0 0; font-size: 13px; color: #94a3b8;">View and manage your personal account settings, preferences, and details.</p>
            </div>
            <span style="background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 11px; padding: 6px 12px; border-radius: 20px; font-weight: 700;">
                Learner / Employee
            </span>
        </div>

        <!-- AVATAR & PHOTO UPLOAD SECTION -->
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px; background-color: #0f172a; padding: 18px; border-radius: 10px; border: 1px solid #334155;">
            <!-- Dynamic Avatar Box -->
            <div id="avatar-preview" style="width: 76px; height: 76px; border-radius: 50%; background-color: #0284c7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; border: 2px solid #38bdf8; flex-shrink: 0; text-transform: uppercase; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);">
                JD
            </div>
            
            <div style="flex-grow: 1;">
                <label style="display: inline-block; background-color: #0284c7; color: #ffffff; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; transition: background-color 0.2s;">
                    📷 Upload Photo
                    <input type="file" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                </label>
                <button type="button" onclick="removePhoto()" style="background-color: transparent; border: 1px solid #475569; color: #cbd5e1; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 6px; cursor: pointer; margin-left: 8px;">
                    Remove
                </button>
                <div style="font-size: 11px; color: #64748b; margin-top: 8px;">Allowed JPG, PNG, or GIF. Max filesize 2MB.</div>
            </div>
        </div>

        <!-- USER FORM -->
        <form id="profile-form" onsubmit="handleProfileUpdate(event)">
            
            <!-- FULL NAME & USER ID -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Full Name *</label>
                    <input type="text" id="profile-fullname" value="John Doe" required style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;" oninput="updateInitialsLive()">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Employee ID</label>
                    <input type="text" value="EMP-10948" disabled style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #64748b; box-sizing: border-box; outline: none; cursor: not-allowed;">
                </div>
            </div>

            <!-- EMAIL ADDRESS & PHONE NUMBER -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Email Address *</label>
                    <input type="email" id="profile-email" value="john.doe@company.com" required style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Phone Number</label>
                    <input type="tel" id="profile-phone" value="+1 (555) 019-2834" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
            </div>

            <!-- JOB TITLE & DEPARTMENT -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Job Title</label>
                    <input type="text" id="profile-title" value="Financial Specialist" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Department</label>
                    <select id="profile-dept" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                        <option value="Finance" selected>Finance & Accounting</option>
                        <option value="HR">Human Resources</option>
                        <option value="IT">Information Technology</option>
                        <option value="Operations">Operations & Logistics</option>
                        <option value="Marketing">Marketing & Sales</option>
                    </select>
                </div>
            </div>

            <!-- LANGUAGE & NOTIFICATION PREFERENCES -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Preferred Language</label>
                    <select id="profile-lang" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                        <option value="en" selected>English (US)</option>
                        <option value="es">Spanish (Español)</option>
                        <option value="fr">French (Français)</option>
                        <option value="de">German (Deutsch)</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 220px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Security Advisories & Alerts</label>
                    <div style="display: flex; gap: 15px; padding-top: 8px;">
                        <label style="font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                            <input type="checkbox" id="notify-email" checked style="accent-color: #0284c7;"> Email
                        </label>
                        <label style="font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                            <input type="checkbox" id="notify-sms" style="accent-color: #0284c7;"> SMS
                        </label>
                    </div>
                </div>
            </div>

            <!-- BIO / PERSONAL SUMMARY -->
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">About / Bio</label>
                <textarea id="profile-bio" rows="3" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none; resize: vertical; font-family: inherit;">Committed to maintaining organizational security awareness and keeping financial workflows secure from phishing threats.</textarea>
            </div>

            <!-- ACTION BUTTONS -->
            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #334155; padding-top: 20px;">
                <button type="button" onclick="resetDefaults()" style="background-color: transparent; border: 1px solid #334155; color: #cbd5e1; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    Cancel
                </button>
                <button type="submit" style="background-color: #10b981; border: none; color: #ffffff; padding: 10px 22px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <span>💾</span> Save Changes
                </button>
            </div>

        </form>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #10b981; color: #ffffff; padding: 12px 22px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); z-index: 9999;">
        ✓ Profile updated successfully!
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let hasUploadedPhoto = false;

        // Dynamic Live Update of Avatar Initials as user types full name
        function updateInitialsLive() {
            if (hasUploadedPhoto) return; // Do not overwrite custom image
            
            const name = document.getElementById('profile-fullname').value.trim();
            const avatarPreview = document.getElementById('avatar-preview');
            
            if (name.length > 0) {
                const words = name.split(' ').filter(w => w.length > 0);
                let initials = words[0][0];
                if (words.length > 1) {
                    initials += words[words.length - 1][0];
                }
                avatarPreview.innerText = initials.toUpperCase();
            } else {
                avatarPreview.innerText = '?';
            }
        }

        // Handle Photo Upload
        function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const avatarPreview = document.getElementById('avatar-preview');
                    avatarPreview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
                    hasUploadedPhoto = true;
                }
                reader.readAsDataURL(file);
            }
        }

        // Remove Uploaded Photo & Revert to Initials
        function removePhoto() {
            hasUploadedPhoto = false;
            updateInitialsLive();
        }

        // Save Profile Handler
        function handleProfileUpdate(e) {
            e.preventDefault();
            
            // Show Notification Toast
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Cancel / Reset Actions
        function resetDefaults() {
            if (confirm("Discard unsaved changes?")) {
                document.getElementById('profile-form').reset();
                hasUploadedPhoto = false;
                updateInitialsLive();
            }
        }
    </script>
</body>
</html>
