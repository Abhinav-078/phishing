<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View & Update Profile - Security Analyst</title>
</head>
<body style="margin: 0; padding: 40px 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">

    <!-- MAIN PROFILE CARD -->
    <div style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 680px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);">
        
        <!-- CARD HEADER -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 25px;">
            <div>
                <h1 style="margin: 0; font-size: 22px; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                    ⚙️ Security Analyst Profile
                </h1>
                <p style="margin: 5px 0 0 0; font-size: 13px; color: #94a3b8;">Manage your personal credentials, clearance level, and operations settings.</p>
            </div>
            <span style="background-color: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 11px; padding: 6px 12px; border-radius: 20px; font-weight: 700;">
                ● Active Duty
            </span>
        </div>

        <!-- AVATAR & QUICK STATS -->
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px; background-color: #0f172a; padding: 16px; border-radius: 10px; border: 1px solid #334155;">
            <div id="avatar-preview" style="width: 72px; height: 72px; border-radius: 50%; background-color: #0284c7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; border: 2px solid #38bdf8; flex-shrink: 0; text-transform: uppercase;">
                SJ
            </div>
            <div style="flex-grow: 1;">
                <label style="display: inline-block; background-color: #0284c7; color: #ffffff; font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 6px; cursor: pointer;">
                    Upload Profile Picture
                    <input type="file" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                </label>
                <div style="font-size: 11px; color: #64748b; margin-top: 6px;">Supported formats: JPG, PNG. Max size: 2MB.</div>
            </div>
            <div style="text-align: right; border-left: 1px solid #334155; padding-left: 16px;">
                <div style="font-size: 11px; color: #94a3b8;">Clearance Level</div>
                <div style="font-size: 14px; font-weight: 700; color: #38bdf8;">Level 4 (Top Secret)</div>
            </div>
        </div>

        <!-- PROFILE FORM -->
        <form onsubmit="handleProfileUpdate(event)">
            
            <!-- FULL NAME & ANALYST ID -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 200px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Full Name</label>
                    <input type="text" id="profile-fullname" value="Dr. Sarah Jenkins" required style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Analyst ID</label>
                    <input type="text" value="SEC-88021" disabled style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #64748b; box-sizing: border-box; outline: none; cursor: not-allowed;">
                </div>
            </div>

            <!-- WORK EMAIL & PHONE -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Corporate Email</label>
                    <input type="email" id="profile-email" value="s.jenkins@cybersec.org" required style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Secure Phone Line</label>
                    <input type="tel" id="profile-phone" value="+1 (555) 234-5678" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
            </div>

            <!-- ROLE & SPECIALIZATION -->
            <div style="display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Designation / Title</label>
                    <input type="text" id="profile-title" value="Senior Threat Analyst" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Primary Specialization</label>
                    <select id="profile-spec" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none;">
                        <option value="phishing">Phishing & Smishing Analysis</option>
                        <option value="malware">Malware & APK Reverse Engineering</option>
                        <option value="network">Network Threat Hunting</option>
                        <option value="incident">SOC Incident Response</option>
                    </select>
                </div>
            </div>

            <!-- SECURITY BIO / TECHNICAL SUMMARY -->
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Operational Bio & Focus Areas</label>
                <textarea id="profile-bio" rows="3" style="width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #ffffff; box-sizing: border-box; outline: none; resize: vertical; font-family: inherit;">Focused on email threat vector triage, automated phishing indicators, and updating AI Risk Scoring detection rules.</textarea>
            </div>

            <!-- BUTTONS -->
            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #334155; padding-top: 20px;">
                <button type="button" onclick="resetForm()" style="background-color: transparent; border: 1px solid #334155; color: #cbd5e1; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    Discard Changes
                </button>
                <button type="submit" style="background-color: #10b981; border: none; color: #ffffff; padding: 10px 22px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <span>💾</span> Save Profile Updates
                </button>
            </div>

        </form>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #10b981; color: #ffffff; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);">
        Security profile updated successfully!
    </div>

    <script>
        function handleProfileUpdate(e) {
            e.preventDefault();
            
            // Sync Initials on Avatar Preview
            const name = document.getElementById('profile-fullname').value.trim();
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2);
            
            const avatarPreview = document.getElementById('avatar-preview');
            if (!avatarPreview.querySelector('img')) {
                avatarPreview.innerText = initials;
            }

            // Display Success Toast
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const avatarPreview = document.getElementById('avatar-preview');
                    avatarPreview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function resetForm() {
            alert('Form changes have been discarded.');
        }
    </script>
</body>
</html>
